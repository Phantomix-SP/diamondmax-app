<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantomix Admin | Gallery Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .admin-card {
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 15px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #0ea5e9; margin-top: 0; }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #020617;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button.upload-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        button.upload-btn:hover { opacity: 0.9; }
        .status-msg { text-align: center; font-size: 13px; margin-top: 15px; font-weight: 600; }
        
        /* Manage List */
        .photo-list { margin-top: 30px; border-top: 1px solid #334155; padding-top: 20px; }
        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #020617;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .item-row img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; }
        .item-info { flex: 1; margin-left: 12px; text-align: left; }
        .item-info h4 { margin: 0; font-size: 13px; color: #fff; }
        .item-info p { margin: 0; font-size: 11px; color: #94a3b8; }
        .delete-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2><i class="fas fa-cloud-upload-alt"></i> Upload to Gallery</h2>
        
        <div class="input-group">
            <label>Select Photo (Auto-Compressed)</label>
            <input type="file" id="photoInput" accept="image/*">
        </div>

        <div class="input-group">
            <label>Title</label>
            <input type="text" id="titleInput" placeholder="e.g. DiamondMax Launch Event">
        </div>

        <div class="input-group">
            <label>Category</label>
            <select id="categoryInput">
                <option value="apps">Apps & UI</option>
                <option value="team">Team & Behind Scenes</option>
                <option value="updates">Posters & Socials</option>
            </select>
        </div>

        <div class="input-group">
            <label>Description</label>
            <input type="text" id="descInput" placeholder="Short line about this photo...">
        </div>

        <button class="upload-btn" onclick="uploadPhoto()"><i class="fas fa-paper-plane"></i> Upload From Phone</button>

        <div id="statusMsg" class="status-msg"></div>

        <div class="photo-list">
            <h3 style="font-size: 16px; color: #0ea5e9;">Manage Existing Photos</h3>
            <div id="manageList">Loading...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://pekmsttmosuzcvielala.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBla21zdHRtb3N1emN2aWVsYWxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MjY4NDUsImV4cCI6MjA5OTAwMjg0NX0.D0akjMO2d5sYhgbSy8IIFJT4sPHGO_Lm9r1YMWM_uUc";

        // Image Auto-Compression Function (Phone mein hi 100-200KB kar deta hai)
        function compressImage(file, maxWidth = 1200, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('canvas');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function uploadPhoto() {
            const fileInput = document.getElementById('photoInput');
            const title = document.getElementById('titleInput').value.trim();
            const category = document.getElementById('categoryInput').value;
            const desc = document.getElementById('descInput').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!fileInput.files[0] || !title) {
                alert("Please select a photo and type a title!");
                return;
            }

            try {
                statusMsg.style.color = "#0ea5e9";
                statusMsg.innerText = "⏳ Compressing image on phone...";

                const rawFile = fileInput.files[0];
                const compressedBlob = await compressImage(rawFile);

                statusMsg.innerText = "🚀 Uploading to Mainframe...";
                const fileName = `photo_${Date.now()}.jpg`;

                // 1. Upload compressed image to Supabase Storage
                const storageResp = await fetch(`${SUPABASE_URL}/storage/v1/object/gallery-images/${fileName}`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "image/jpeg"
                    },
                    body: compressedBlob
                });

                if (!storageResp.ok) throw new Error("Storage Upload Failed!");

                const publicImageUrl = `${SUPABASE_URL}/storage/v1/object/public/gallery-images/${fileName}`;

                // 2. Save metadata in Database Table
                const dbResp = await fetch(`${SUPABASE_URL}/rest/v1/gallery`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title: title,
                        category: category,
                        description: desc,
                        image_url: publicImageUrl
                    })
                });

                if (dbResp.ok) {
                    statusMsg.style.color = "#10b981";
                    statusMsg.innerText = "✅ Upload Successful!";
                    fileInput.value = "";
                    document.getElementById('titleInput').value = "";
                    document.getElementById('descInput').value = "";
                    fetchManageList();
                }

            } catch (err) {
                console.error(err);
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "❌ Upload Failed. Check Supabase Storage Bucket Setup!";
            }
        }

        async function fetchManageList() {
            const listDiv = document.getElementById('manageList');
            try {
                const resp = await fetch(`${SUPABASE_URL}/rest/v1/gallery?select=*&order=created_at.desc`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await resp.json();
                listDiv.innerHTML = "";
                
                if(data.length === 0) {
                    listDiv.innerText = "No photos uploaded yet.";
                    return;
                }

                data.forEach(item => {
                    listDiv.innerHTML += `
                        <div class="item-row">
                            <img src="${item.image_url}">
                            <div class="item-info">
                                <h4>${item.title}</h4>
                                <p>${item.category}</p>
                            </div>
                            <button class="delete-btn" onclick="deletePhoto(${item.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                });
            } catch (e) {
                listDiv.innerText = "Failed to load list.";
            }
        }

        async function deletePhoto(id) {
            if(!confirm("Photo delete karein? Isse storage wapas free ho jayegi.")) return;

            await fetch(`${SUPABASE_URL}/rest/v1/gallery?id=eq.${id}`, {
                method: "DELETE",
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            });
            fetchManageList();
        }

        window.onload = fetchManageList;
    </script>
</body>
</html>
