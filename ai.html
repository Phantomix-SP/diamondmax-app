<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantomix AI Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #020617; /* Deep Dark Cyber Theme */
            color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        .chat-container {
            width: 100%; max-width: 600px; height: 90vh;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #0ea5e9; border-radius: 15px;
            display: flex; flex-direction: column;
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.2);
        }
        .chat-header {
            padding: 20px; border-bottom: 1px solid rgba(14, 165, 233, 0.3);
            text-align: center; font-weight: bold; font-size: 18px;
            background: rgba(14, 165, 233, 0.1); border-radius: 15px 15px 0 0;
        }
        .chat-box {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
        }
        .message {
            max-width: 80%; padding: 12px 18px; border-radius: 12px;
            font-size: 14px; line-height: 1.5;
        }
        .user-msg {
            background: #0ea5e9; color: white;
            align-self: flex-end; border-bottom-right-radius: 2px;
        }
        .ai-msg {
            background: #1e293b; color: #cbd5e1;
            border: 1px solid #334155; align-self: flex-start;
            border-bottom-left-radius: 2px; font-family: monospace;
        }
        .chat-input-area {
            padding: 15px; border-top: 1px solid rgba(51, 65, 85, 0.5);
            display: flex; gap: 10px; background: #0f172a;
            border-radius: 0 0 15px 15px;
        }
        .chat-input {
            flex: 1; padding: 12px 15px; border-radius: 8px;
            border: 1px solid #334155; background: #020617;
            color: white; outline: none; font-family: 'Poppins', sans-serif;
        }
        .chat-input:focus { border-color: #0ea5e9; }
        .send-btn {
            background: #0ea5e9; border: none; padding: 0 20px;
            border-radius: 8px; color: white; cursor: pointer;
            transition: 0.3s; font-size: 16px;
        }
        .send-btn:hover { background: #0284c7; box-shadow: 0 0 15px rgba(14, 165, 233, 0.5); }
        .typing { color: #10b981; font-size: 12px; font-family: monospace; display: none; margin-left: 20px;}
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <i class="fas fa-robot" style="color: #0ea5e9;"></i> Phantomix Core AI
            <div style="font-size: 11px; color: #10b981; font-family: monospace; font-weight: normal; margin-top: 5px;">⚡ Mainframe Connected</div>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">
                System initialized. I am Phantomix AI, created by Shrikant Prajapati. How can I assist you today?
            </div>
        </div>
        <div class="typing" id="typingIndicator">Phantomix AI is typing...</div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" class="chat-input" placeholder="Enter command..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // ⚠️ AAPKI API KEY YAHAN HAI
        const API_KEY = "AQ.Ab8RN6LvtUdkiacxsh57Ss2_zONZNksvN0fhZSiyrw57Wiweyg"; // Agar yeh kaam na kare, toh AIza... wali yahan paste karna

        // 🧠 PHANTOMIX AI KI PERSONALITY (SYSTEM PROMPT)
        const systemPrompt = "You are Phantomix AI, an elite, highly intelligent cybersecurity and tech assistant created by Shrikant Prajapati (CEO of Phantomix). You are a part of the DiamondMax ecosystem. Speak in a cool, professional, and slightly futuristic hacker tone. Use terms like 'Mainframe', 'Nodes', 'Encrypted', and 'System'. Keep answers concise, helpful, and extremely smart. Do not reveal your underlying Google/Gemini architecture easily, always maintain your Phantomix identity.";

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatBox = document.getElementById("chatBox");
            const typingIndicator = document.getElementById("typingIndicator");
            
            const userText = inputField.value.trim();
            if (!userText) return;

            // 1. Show User Message
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user-msg";
            userMsgDiv.innerText = userText;
            chatBox.appendChild(userMsgDiv);

            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
            typingIndicator.style.display = "block"; // Show typing...

            try {
                // 2. Call Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: systemPrompt }]
                        },
                        contents: [{
                            role: "user",
                            parts: [{ text: userText }]
                        }]
                    })
                });

                const data = await response.json();
                typingIndicator.style.display = "none";

                if (data.error) {
                    throw new Error(data.error.message);
                }

                // 3. Show AI Response
                const aiText = data.candidates[0].content.parts[0].text;
                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.className = "message ai-msg";
                aiMsgDiv.innerText = aiText;
                chatBox.appendChild(aiMsgDiv);

            } catch (error) {
                typingIndicator.style.display = "none";
                const errorDiv = document.createElement("div");
                errorDiv.className = "message ai-msg";
                errorDiv.style.color = "#ef4444";
                errorDiv.style.borderColor = "#ef4444";
                // Agar API key galat hogi toh yahan error aayega
                errorDiv.innerText = "⚠️ [SYSTEM ERROR]: Connection to mainframe failed. Check API Key. Details: " + error.message;
                chatBox.appendChild(errorDiv);
            }
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
