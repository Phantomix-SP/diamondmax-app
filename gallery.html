<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Gallery | Phantomix</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/phantomix-dev/phantomix-dev.github.io/main/assets/logo.png">
<meta name="description" content="Phantomix Media Vault. Explore high-res app screenshots, team behind the scenes, and official ecosystem updates.">
<meta name="keywords" content="Phantomix Gallery, UI Designs, Behind the Scenes, Media Vault">
<meta name="author" content="Shrikant Prajapati & Ranjan Gupta">

<meta property="og:type" content="website">
<meta property="og:url" content="https://phantomix-dev.github.io/gallery.html">
<meta property="og:title" content="Media Vault | Phantomix">
<meta property="og:description" content="Zero cropping. Zero clicks. Dive into our exclusive masonry feed.">
<meta property="og:image" content="https://raw.githubusercontent.com/phantomix-dev/phantomix-dev.github.io/main/logo.png">

<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://phantomix-dev.github.io/gallery.html">
<meta property="twitter:title" content="Media Vault | Phantomix">
<meta property="twitter:description" content="Zero cropping. Zero clicks. Dive into our exclusive masonry feed.">
<meta property="twitter:image" content="https://raw.githubusercontent.com/phantomix-dev/phantomix-dev.github.io/main/logo.png">
    
    <style>
        ::selection { background-color: #0ea5e9; color: #ffffff; }
        
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #0ea5e9; }

        body {
            margin: 0; padding: 0; padding-top: 100px;
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a; color: #ffffff;
            text-align: center; overflow-x: hidden; position: relative;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        /* Glowing Background */
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; background: #0f172a;
        }
        .glow-shape {
            position: absolute; filter: blur(80px); opacity: 0.5;
            animation: float 10s infinite alternate ease-in-out; border-radius: 50%;
        }
        .shape1 { width: 400px; height: 400px; background: #0ea5e9; top: -10%; left: -10%; animation-duration: 12s; }
        .shape2 { width: 500px; height: 500px; background: #8b5cf6; bottom: -20%; right: -10%; animation-duration: 15s; }
        
        @keyframes float { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(-50px) scale(1.1); } }

        /* Navbar */
        .phantomix-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px); border-bottom: 1px solid rgba(14, 165, 233, 0.2);
            z-index: 1000; box-sizing: border-box;
        }
        .nav-logo { font-size: 20px; font-weight: 700; color: white; display: flex; align-items: center; text-decoration: none; }
        .nav-btn {
            background: rgba(14, 165, 233, 0.1); color: #0ea5e9; padding: 8px 18px;
            border: 1px solid #0ea5e9; border-radius: 6px; text-decoration: none;
            font-size: 14px; font-weight: 600; transition: all 0.3s ease;
        }
        .nav-btn:hover { background: #0ea5e9; color: white; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }

        /* Header */
        .gallery-header { max-width: 800px; margin: 20px auto 40px; padding: 0 20px; }
        h1 { font-size: 36px; margin: 0 0 10px 0; color: #fff; }
        h1 span { color: #0ea5e9; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; }

        /* Filter Buttons */
        .filter-container { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 40px; padding: 0 20px; }
        .filter-btn {
            background: rgba(30, 41, 59, 0.6); color: #94a3b8; border: 1px solid rgba(51, 65, 85, 0.6);
            padding: 8px 20px; border-radius: 20px; font-family: 'Poppins', sans-serif;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #0ea5e9; color: #ffffff; border-color: #0ea5e9; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
        }

        /* 🚀 MASONRY FEED LAYOUT (Instagram/Pinterest Style) */
        .gallery-grid {
            column-count: 3; /* Desktop par 3 columns */
            column-gap: 25px;
            max-width: 1200px; margin: 0 auto 60px; padding: 0 20px;
            box-sizing: border-box;
        }
        
        .gallery-item {
            background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 14px; overflow: hidden; transition: all 0.4s ease;
            display: block; 
            break-inside: avoid; /* Ensure card doesn't cut in half between columns */
            margin-bottom: 25px;
        }
        .gallery-item:hover { border-color: #0ea5e9; box-shadow: 0 10px 30px rgba(14, 165, 233, 0.2); }
        
        /* Auto-Resizing Image Wrapper */
        .gallery-img-wrapper { width: 100%; height: auto; background: #020617; }
        .gallery-img-wrapper img { width: 100%; height: auto; display: block; }
        
        .gallery-info { padding: 18px; text-align: left; }
        .gallery-tag { font-size: 10px; font-weight: 700; color: #0ea5e9; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
        .gallery-title { font-size: 16px; color: #f8fafc; margin: 0 0 6px 0; font-weight: 600; }
        .gallery-desc { color: #94a3b8; font-size: 12px; margin: 0; line-height: 1.5; }

        /* Footer */
        .phantomix-footer { background: #020617; border-top: 1px solid rgba(14, 165, 233, 0.2); padding: 30px 5%; margin-top: auto; font-size: 13px; color: #64748b; text-align: center; }

        /* 📱 Responsive Mobile Feed (1 Column like Instagram) */
        @media (max-width: 900px) {
            .gallery-grid { column-count: 2; }
        }
        @media (max-width: 600px) {
            body { padding-top: 80px; }
            .phantomix-navbar { height: 60px; padding: 0 15px; }
            .nav-logo { font-size: 16px; }
            .gallery-header h1 { font-size: 26px; }
            
            /* Pure 1-column vertical feed for mobile */
            .gallery-grid { column-count: 1; padding: 0 15px; }
            .gallery-item { margin-bottom: 20px; }
            
            .filter-container { gap: 8px; }
            .filter-btn { padding: 6px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="bg-animation"><div class="glow-shape shape1"></div><div class="glow-shape shape2"></div></div>

    <nav class="phantomix-navbar">
        <a href="index.html" class="nav-logo"><i class="fa-solid fa-gem" style="color: #0ea5e9; margin-right: 8px;"></i> Phantomix</a>
        <a href="apps.html" class="nav-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
    </nav>

    <div class="gallery-header">
        <h1>Phantomix <span>Media Vault</span></h1>
        <p>Explore high-res app screenshots, team behind the scenes, and official ecosystem updates.</p>
    </div>

    <div class="filter-container">
        <button class="filter-btn active" onclick="filterGallery('all', event)">All Media</button>
        <button class="filter-btn" onclick="filterGallery('apps', event)">Apps & UI</button>
        <button class="filter-btn" onclick="filterGallery('team', event)">Team & Behind Scenes</button>
        <button class="filter-btn" onclick="filterGallery('updates', event)">Posters & Socials</button>
    </div>

    <div class="gallery-grid" id="galleryGrid"><p style="color: #0ea5e9;">Connecting to Mainframe Vault...</p></div>

    <footer class="phantomix-footer">
        <p>&copy; 2026 Phantomix. All rights reserved. Built with passion by Shrikant Prajapati & Ranjan Gupta.</p>
    </footer>

    <script>
        const SUPABASE_URL = "https://pekmsttmosuzcvielala.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBla21zdHRtb3N1emN2aWVsYWxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MjY4NDUsImV4cCI6MjA5OTAwMjg0NX0.D0akjMO2d5sYhgbSy8IIFJT4sPHGO_Lm9r1YMWM_uUc";

        let allGalleryData = [];

        async function fetchGalleryFromSupabase() {
            const grid = document.getElementById('galleryGrid');
            try {
                const resp = await fetch(`${SUPABASE_URL}/rest/v1/gallery?select=*&order=created_at.desc`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                
                allGalleryData = await resp.json();
                renderGallery('all');
            } catch (err) {
                grid.innerHTML = "<p style='color:#ef4444;'>Failed to load media vault.</p>";
            }
        }

        function renderGallery(filter = 'all') {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = "";

            const filteredItems = filter === 'all' 
                ? allGalleryData 
                : allGalleryData.filter(item => item.category === filter);

            if(filteredItems.length === 0) {
                grid.innerHTML = "<p style='color:#94a3b8;'>No media found in this category.</p>";
                return;
            }

            filteredItems.forEach(item => {
                // Yahan a tag hata kar wapas div kar diya hai kyunki ab click ki zaroorat nahi
                const card = document.createElement('div');
                card.className = 'gallery-item';

                card.innerHTML = `
                    <div class="gallery-img-wrapper">
                        <img src="${item.image_url}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="gallery-info">
                        <span class="gallery-tag"><i class="fas fa-layer-group"></i> ${item.category.toUpperCase()}</span>
                        <h3 class="gallery-title">${item.title}</h3>
                        <p class="gallery-desc">${item.description || ''}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGallery(category, evt) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if(evt) evt.target.classList.add('active');
            renderGallery(category);
        }

        window.onload = fetchGalleryFromSupabase;
    </script>
</body>
</html>
