<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Gallery | Phantomix</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        ::selection { background-color: #0ea5e9; color: #ffffff; }
        ::-moz-selection { background-color: #0ea5e9; color: #ffffff; }
        
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; border: 2px solid #020617; }
        ::-webkit-scrollbar-thumb:hover { background: #0ea5e9; }

        body {
            margin: 0; padding: 0; padding-top: 100px;
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a; color: #ffffff;
            text-align: center; overflow-x: hidden; position: relative;
            animation: appLoad 0.8s ease-out forwards;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        @keyframes appLoad {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Glowing Background */
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; background: #0f172a;
        }
        .glow-shape {
            position: absolute; filter: blur(80px); opacity: 0.5;
            animation: float 10s infinite alternate ease-in-out; border-radius: 50%;
        }
        .shape1 { width: 400px; height: 400px; background: #0ea5e9; top: -10%; left: -10%; animation-duration: 12s; }
        .shape2 { width: 500px; height: 500px; background: #8b5cf6; bottom: -20%; right: -10%; animation-duration: 15s; }
        
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-50px) scale(1.1); }
        }

        /* Navbar */
        .phantomix-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px); border-bottom: 1px solid rgba(14, 165, 233, 0.2);
            z-index: 1000; box-sizing: border-box;
        }
        .nav-logo { font-size: 20px; font-weight: 700; color: white; display: flex; align-items: center; text-decoration: none; }
        .nav-btn {
            background: rgba(14, 165, 233, 0.1); color: #0ea5e9; padding: 8px 18px;
            border: 1px solid #0ea5e9; border-radius: 6px; text-decoration: none;
            font-size: 14px; font-weight: 600; transition: all 0.3s ease;
        }
        .nav-btn:hover { background: #0ea5e9; color: white; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }

        /* Gallery Header */
        .gallery-header { max-width: 800px; margin: 20px auto 40px; padding: 0 20px; }
        h1 { font-size: 36px; margin: 0 0 10px 0; color: #fff; }
        h1 span { color: #0ea5e9; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; }

        /* Filter Buttons */
        .filter-container {
            display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 40px; padding: 0 20px;
        }
        .filter-btn {
            background: rgba(30, 41, 59, 0.6); color: #94a3b8; border: 1px solid rgba(51, 65, 85, 0.6);
            padding: 8px 20px; border-radius: 20px; font-family: 'Poppins', sans-serif;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #0ea5e9; color: #ffffff; border-color: #0ea5e9;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
        }

        /* Gallery Grid Layout */
        .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; max-width: 1200px; margin: 0 auto 60px; padding: 0 20px; box-sizing: border-box;
        }
        .gallery-item {
            background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 14px; overflow: hidden; transition: all 0.4s ease;
            display: flex; flex-direction: column; cursor: pointer; position: relative;
        }
        .gallery-item:hover {
            transform: translateY(-6px); border-color: #0ea5e9;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.2);
        }
        .gallery-img-wrapper {
            width: 100%; height: 200px; overflow: hidden; background: #020617; position: relative;
        }
        .gallery-img-wrapper img {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;
        }
        .gallery-item:hover .gallery-img-wrapper img { transform: scale(1.08); }
        
        .gallery-info { padding: 18px; text-align: left; display: flex; flex-direction: column; flex-grow: 1; }
        .gallery-tag {
            font-size: 10px; font-weight: 700; color: #0ea5e9; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 6px;
        }
        .gallery-title { font-size: 16px; color: #f8fafc; margin: 0 0 6px 0; font-weight: 600; }
        .gallery-desc { color: #94a3b8; font-size: 12px; margin: 0; line-height: 1.5; }

        /* 📱 FIXED MOBILE LIGHTBOX MODAL (No Scroll Required!) */
        #lightbox-modal {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background: rgba(2, 6, 23, 0.95); 
            backdrop-filter: blur(10px); 
            z-index: 999999;
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            padding: 20px; 
            box-sizing: border-box;
        }
        #lightbox-modal img {
            max-width: 90%; 
            max-height: 70vh; 
            border-radius: 10px; 
            border: 1px solid rgba(14, 165, 233, 0.4);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
            object-fit: contain;
        }
        #lightbox-caption { color: #f8fafc; font-size: 15px; margin-top: 15px; font-weight: 600; text-align: center; }
        .close-lightbox {
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: rgba(255,255,255,0.1);
            color: #fff; 
            border: none; 
            width: 42px; 
            height: 42px; 
            border-radius: 50%;
            font-size: 20px; 
            cursor: pointer; 
            transition: 0.3s; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        .close-lightbox:hover { background: #ef4444; }

        /* Footer */
        .phantomix-footer {
            background: #020617; border-top: 1px solid rgba(14, 165, 233, 0.2);
            padding: 30px 5%; margin-top: auto; font-size: 13px; color: #64748b; text-align: center;
        }

        /* 📱 Mobile Responsive Layout Fix */
        @media (max-width: 768px) {
            body { padding-top: 80px; }
            .phantomix-navbar { height: 60px; padding: 0 15px; }
            .nav-logo { font-size: 16px; }
            .gallery-header h1 { font-size: 26px; }
            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 0 15px;
            }
            .filter-container { gap: 8px; }
            .filter-btn { padding: 6px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="bg-animation">
        <div class="glow-shape shape1"></div>
        <div class="glow-shape shape2"></div>
    </div>

    <nav class="phantomix-navbar">
        <a href="index.html" class="nav-logo">
            <i class="fa-solid fa-gem" style="color: #0ea5e9; margin-right: 8px;"></i> Phantomix
        </a>
        <a href="apps.html" class="nav-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
    </nav>

    <div class="gallery-header">
        <h1>Phantomix <span>Media Vault</span></h1>
        <p>Explore high-res app screenshots, team behind the scenes, and official ecosystem updates.</p>
    </div>

    <div class="filter-container">
        <button class="filter-btn active" onclick="filterGallery('all', event)">All Media</button>
        <button class="filter-btn" onclick="filterGallery('apps', event)">Apps & UI</button>
        <button class="filter-btn" onclick="filterGallery('team', event)">Team & Behind Scenes</button>
        <button class="filter-btn" onclick="filterGallery('updates', event)">Posters & Socials</button>
    </div>

    <div class="gallery-grid" id="galleryGrid">
        <p style="color: #0ea5e9;">Connecting to Mainframe Vault...</p>
    </div>

    <div id="lightbox-modal" onclick="closeLightbox()">
        <button class="close-lightbox" onclick="closeLightbox()">&times;</button>
        <img id="lightbox-img" src="" alt="Zoomed View" onclick="event.stopPropagation()">
        <div id="lightbox-caption" onclick="event.stopPropagation()"></div>
    </div>

    <footer class="phantomix-footer">
        <p>&copy; 2026 Phantomix. All rights reserved. Built with passion by Shrikant Prajapati & Ranjan Gupta.</p>
    </footer>

    <script>
        const SUPABASE_URL = "https://pekmsttmosuzcvielala.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBla21zdHRtb3N1emN2aWVsYWxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MjY4NDUsImV4cCI6MjA5OTAwMjg0NX0.D0akjMO2d5sYhgbSy8IIFJT4sPHGO_Lm9r1YMWM_uUc";

        let allGalleryData = [];

        async function fetchGalleryFromSupabase() {
            const grid = document.getElementById('galleryGrid');
            try {
                const resp = await fetch(`${SUPABASE_URL}/rest/v1/gallery?select=*&order=created_at.desc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                allGalleryData = await resp.json();
                renderGallery('all');
            } catch (err) {
                console.error(err);
                grid.innerHTML = "<p style='color:#ef4444;'>Failed to load media vault.</p>";
            }
        }

        function renderGallery(filter = 'all') {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = "";

            const filteredItems = filter === 'all' 
                ? allGalleryData 
                : allGalleryData.filter(item => item.category === filter);

            if(filteredItems.length === 0) {
                grid.innerHTML = "<p style='color:#94a3b8; grid-column: 1/-1;'>No media found in this category.</p>";
                return;
            }

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'gallery-item';
                card.onclick = () => openLightbox(item.image_url, item.title);

                card.innerHTML = `
                    <div class="gallery-img-wrapper">
                        <img src="${item.image_url}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="gallery-info">
                        <span class="gallery-tag"><i class="fas fa-tag"></i> ${item.category.toUpperCase()}</span>
                        <h3 class="gallery-title">${item.title}</h3>
                        <p class="gallery-desc">${item.description || ''}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGallery(category, evt) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if(evt) evt.target.classList.add('active');
            renderGallery(category);
        }

        // 📱 Lightbox Open & Lock Scroll
        function openLightbox(imgSrc, captionText) {
            const modal = document.getElementById('lightbox-modal');
            const modalImg = document.getElementById('lightbox-img');
            const caption = document.getElementById('lightbox-caption');

            modal.style.display = 'flex';
            modalImg.src = imgSrc;
            caption.innerText = captionText;
            
            // Screen scroll lock kar dega taaki top par na jana pade
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').style.display = 'none';
            // Scroll wapas enable karega
            document.body.style.overflow = 'auto';
        }

        window.onload = fetchGalleryFromSupabase;
    </script>
</body>
</html>
