<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Morph | Offline File Converter</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/phantomix-dev/phantomix-dev.github.io/main/assets/favicon.png">
    <meta name="description" content="Phantom Morph. 100% offline image converter. Convert JPG, PNG, and WEBP instantly without servers.">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        ::selection { background-color: #0ea5e9; color: #ffffff; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #0ea5e9; }

        body {
            background-color: #020617; color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 0; padding-top: 80px; 
            display: flex; flex-direction: column; min-height: 100vh;
        }

        /* Navbar */
        .phantomix-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px); border-bottom: 1px solid rgba(14, 165, 233, 0.2);
            z-index: 1000; box-sizing: border-box;
        }
        .nav-logo { font-size: 20px; font-weight: 700; color: white; display: flex; align-items: center; text-decoration: none; }
        .nav-actions { display: flex; gap: 12px; }
        .nav-btn {
            background: rgba(14, 165, 233, 0.1); color: #0ea5e9; padding: 8px 18px;
            border: 1px solid #0ea5e9; border-radius: 6px; text-decoration: none;
            font-size: 14px; font-weight: 600; transition: all 0.3s ease;
        }
        .nav-btn:hover { background: #0ea5e9; color: white; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }

        /* Main App Wrapper */
        .main-wrapper {
            flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px;
        }

        .app-container {
            background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 16px; padding: 30px; width: 100%; max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center;
        }

        h2 { margin: 0 0 5px 0; color: #f8fafc; font-size: 26px; }
        h2 span { color: #0ea5e9; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }

        .upload-area {
            border: 2px dashed #334155; border-radius: 12px; padding: 30px 20px;
            background: rgba(2, 6, 23, 0.5); cursor: pointer; transition: 0.3s;
            position: relative; overflow: hidden;
        }
        .upload-area:hover { border-color: #0ea5e9; background: rgba(14, 165, 233, 0.05); }
        .upload-area i { font-size: 30px; color: #0ea5e9; margin-bottom: 10px; }
        .upload-area p { margin: 0; font-size: 14px; font-weight: 600; color: #cbd5e1; }
        input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .convert-section { display: none; margin-top: 25px; text-align: left; }
        
        .file-info {
            background: #020617; padding: 12px 15px; border-radius: 8px;
            border: 1px solid #334155; margin-bottom: 15px; text-align: center;
        }
        .file-name { font-size: 14px; font-weight: 600; color: #f8fafc; margin-bottom: 5px; word-break: break-all; }
        .file-meta { font-size: 11px; color: #0ea5e9; text-transform: uppercase; letter-spacing: 1px; }

        .format-group { margin-bottom: 20px; }
        .format-group label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
        select {
            width: 100%; padding: 12px; background: #020617; border: 1px solid #334155;
            color: #f8fafc; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; outline: none;
        }
        select:focus { border-color: #0ea5e9; }

        .action-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }
        .action-btn:hover { box-shadow: 0 0 20px rgba(14, 165, 233, 0.4); transform: translateY(-2px); }
        
        #statusMsg { font-size: 13px; font-weight: 600; text-align: center; margin-top: 15px; display: none; }

        /* Footer */
        .phantomix-footer { background: #020617; border-top: 1px solid rgba(14, 165, 233, 0.2); padding: 30px 5%; margin-top: auto; font-size: 13px; color: #64748b; text-align: center; width: 100%; box-sizing: border-box; }

        @media (max-width: 600px) {
            .phantomix-navbar { padding: 0 15px; }
            .nav-logo { font-size: 16px; }
            .nav-btn { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <nav class="phantomix-navbar">
        <a href="index.html" class="nav-logo"><i class="fa-solid fa-gem" style="color: #0ea5e9; margin-right: 8px;"></i> Phantomix</a>
        <div class="nav-actions">
            <a href="apps.html" class="nav-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="app-container">
            <h2>Phantom <span>Morph</span></h2>
            <p class="subtitle"><i class="fas fa-exchange-alt"></i> Offline Image Format Converter</p>

            <div class="upload-area" id="dropZone">
                <i class="fas fa-images"></i>
                <p>Click or Drop Image (JPG, PNG, WEBP)</p>
                <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp">
            </div>

            <div class="convert-section" id="convertSection">
                <div class="file-info">
                    <div class="file-name" id="fileName">image.jpg</div>
                    <div class="file-meta" id="fileMeta">Original: JPG | Size: 0 KB</div>
                </div>

                <div class="format-group">
                    <label>Convert To:</label>
                    <select id="outputFormat">
                        <option value="image/png">PNG (Lossless & Transparent)</option>
                        <option value="image/jpeg">JPG (Smaller Size)</option>
                        <option value="image/webp">WEBP (Next-Gen Web Format)</option>
                    </select>
                </div>

                <button class="action-btn" id="convertBtn"><i class="fas fa-sync-alt"></i> Convert & Download</button>
                <div id="statusMsg"></div>
            </div>
        </div>
    </div>

    <footer class="phantomix-footer">
        <p>&copy; 2026 Phantomix. All rights reserved. Built with passion by Shrikant Prajapati & Ranjan Gupta.</p>
    </footer>

    <script>
        const fileInput = document.getElementById('fileInput');
        const convertSection = document.getElementById('convertSection');
        const fileNameDisplay = document.getElementById('fileName');
        const fileMetaDisplay = document.getElementById('fileMeta');
        const outputFormat = document.getElementById('outputFormat');
        const convertBtn = document.getElementById('convertBtn');
        const statusMsg = document.getElementById('statusMsg');

        let originalFile = null;

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            originalFile = file;
            fileNameDisplay.innerText = file.name;
            
            // Extract extension for display
            let ext = file.type.split('/')[1].toUpperCase();
            if (ext === 'JPEG') ext = 'JPG';
            
            fileMetaDisplay.innerText = `Original: ${ext} | Size: ${formatBytes(file.size)}`;
            
            convertSection.style.display = 'block';
            statusMsg.style.display = 'none';
        });

        convertBtn.addEventListener('click', () => {
            if (!originalFile) return;
            
            statusMsg.style.display = 'block';
            statusMsg.style.color = "#0ea5e9";
            statusMsg.innerText = "Morphing file... Please wait.";

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const targetType = outputFormat.value;
                    let newExt = targetType.split('/')[1];
                    if (newExt === 'jpeg') newExt = 'jpg';

                    // Remove old extension and add new one
                    const baseName = originalFile.name.substring(0, originalFile.name.lastIndexOf('.')) || originalFile.name;
                    const newFileName = `${baseName}_morphed.${newExt}`;

                    canvas.toBlob((blob) => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = newFileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);

                        statusMsg.style.color = "#10b981";
                        statusMsg.innerText = `✅ Success! Downloaded as ${newExt.toUpperCase()}`;
                    }, targetType, 1.0); // 1.0 ensures maximum quality
                };
            };
            reader.readAsDataURL(originalFile);
        });
    </script>
</body>
</html>
