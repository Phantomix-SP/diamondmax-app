<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantomix | Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Ghost Space Fix */
        html, body { width: 100%; max-width: 100vw; overflow-x: hidden !important; margin: 0; padding: 0; }
        * { box-sizing: border-box; }

        body {
            background-color: #020617; 
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.15), transparent 50%);
        }

        .profile-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #0ea5e9;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
            margin-bottom: 15px;
            object-fit: cover;
        }

        .profile-name { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: 1px; }
        .profile-bio { color: #94a3b8; font-size: 14px; margin-top: 5px; }

        .links-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(14, 165, 233, 0.3);
            padding: 18px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .link-card:hover {
            background: rgba(14, 165, 233, 0.1);
            border-color: #0ea5e9;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.2);
        }

        .link-card i.main-icon { font-size: 20px; color: #0ea5e9; width: 30px; }
        .link-card .arrow { color: #334155; transition: 0.3s; }
        .link-card:hover .arrow { color: #0ea5e9; transform: translateX(5px); }

        .highlight-link {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(14, 165, 233, 0.2));
            border-color: #8b5cf6;
        }
        .highlight-link i.main-icon { color: #8b5cf6; }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .social-row a {
            color: #94a3b8;
            font-size: 24px;
            transition: 0.3s;
        }
        .social-row a:hover { color: #0ea5e9; transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- Logo image source update kar lijiye apni zarurat ke hisaab se -->
        <img src="logo.png" alt="Phantomix" class="profile-img" onerror="this.src='https://via.placeholder.com/100/0ea5e9/ffffff?text=PX'">
        <h1 class="profile-name">Phantomix</h1>
        <p class="profile-bio">Building the ultimate digital ecosystem. 🚀</p>
    </div>

    <div class="links-container">
        <a href="index.html" class="link-card">
            <div style="display: flex; align-items: center;">
                <i class="fas fa-globe main-icon"></i> Official Website
            </div>
            <i class="fas fa-arrow-right arrow"></i>
        </a>

        <a href="index.html#waitlist-section" class="link-card highlight-link">
            <div style="display: flex; align-items: center;">
                <i class="fas fa-gem main-icon"></i> DiamondMax Waitlist ⏳
            </div>
            <i class="fas fa-arrow-right arrow"></i>
        </a>

        <a href="wormhole.html" class="link-card">
            <div style="display: flex; align-items: center;">
                <i class="fas fa-network-wired main-icon"></i> Phantom Wormhole
            </div>
            <i class="fas fa-arrow-right arrow"></i>
        </a>

        <a href="apps.html" class="link-card">
            <div style="display: flex; align-items: center;">
                <i class="fas fa-layer-group main-icon"></i> Explore All 30+ Tools
            </div>
            <i class="fas fa-arrow-right arrow"></i>
        </a>
    </div>

    <div class="social-row">
        <a href="https://instagram.com/phantomix.in"><i class="fab fa-instagram"></i></a>
        <a href="https://twitter.com/ceophantomix"><i class="fab fa-twitter"></i></a>
        <a href="https://www.youtube.com/@Phantomix_SP"><i class="fab fa-youtube"></i></a>
        <a href="mailto:phantomix.00@gmail.com"><i class="fas fa-envelope"></i></a>
    </div>

</body>
</html>
