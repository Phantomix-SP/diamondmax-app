<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Shrink | Universal Compressor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        ::selection { background-color: #0ea5e9; color: #ffffff; }
        
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #0ea5e9; }

        body {
            background-color: #020617; color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 0; padding-top: 80px; 
            display: flex; flex-direction: column; min-height: 100vh;
        }

        /* Navbar */
        .phantomix-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px); border-bottom: 1px solid rgba(14, 165, 233, 0.2);
            z-index: 1000; box-sizing: border-box;
        }
        .nav-logo { font-size: 20px; font-weight: 700; color: white; display: flex; align-items: center; text-decoration: none; }
        .nav-actions { display: flex; gap: 12px; }
        .nav-btn {
            background: rgba(14, 165, 233, 0.1); color: #0ea5e9; padding: 8px 18px;
            border: 1px solid #0ea5e9; border-radius: 6px; text-decoration: none;
            font-size: 14px; font-weight: 600; transition: all 0.3s ease;
        }
        .nav-btn:hover { background: #0ea5e9; color: white; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }
        .btn-support { color: #10b981; border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .btn-support:hover { background: #10b981; color: white; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }

        /* Main App Wrapper */
        .main-wrapper {
            flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px;
        }

        .app-container {
            background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 16px; padding: 30px; width: 100%; max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center; position: relative;
        }

        /* 🚀 Share Button Style */
        .share-btn {
            position: absolute; top: 20px; right: 20px; background: rgba(139, 92, 246, 0.1);
            color: #8b5cf6; border: 1px solid rgba(139, 92, 246, 0.4); border-radius: 50%;
            width: 35px; height: 35px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s ease; font-size: 14px;
        }
        .share-btn:hover {
            background: #8b5cf6; color: white; box-shadow: 0 0 15px rgba(139, 92, 246, 0.5); transform: scale(1.1);
        }

        h2 { margin: 0 0 5px 0; color: #f8fafc; font-size: 26px; }
        h2 span { color: #0ea5e9; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }

        .upload-area {
            border: 2px dashed #334155; border-radius: 12px; padding: 30px 20px;
            background: rgba(2, 6, 23, 0.5); cursor: pointer; transition: 0.3s;
            position: relative; overflow: hidden;
        }
        .upload-area:hover { border-color: #0ea5e9; background: rgba(14, 165, 233, 0.05); }
        .upload-area i { font-size: 30px; color: #0ea5e9; margin-bottom: 10px; }
        .upload-area p { margin: 0; font-size: 14px; font-weight: 600; color: #cbd5e1; }
        input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .preview-section { display: none; margin-top: 25px; text-align: left; }
        
        .stat-box { display: flex; justify-content: space-between; align-items: center; background: #020617; padding: 12px 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px; }
        .stat-box div { text-align: center; }
        .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 16px; font-weight: 700; color: #f8fafc; }

        .slider-group { margin-bottom: 20px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
        input[type="range"] { width: 100%; -webkit-appearance: none; background: #334155; height: 6px; border-radius: 5px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #0ea5e9; cursor: pointer; }

        .action-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #0ea5e9, #3b82f6); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .action-btn:hover { box-shadow: 0 0 20px rgba(14, 165, 233, 0.4); }
        .action-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
        
        #statusMsg { font-size: 12px; color: #0ea5e9; text-align: center; margin-top: 10px; display: none; }

        /* Footer */
        .phantomix-footer { background: #020617; border-top: 1px solid rgba(14, 165, 233, 0.2); padding: 30px 5%; margin-top: auto; font-size: 13px; color: #64748b; text-align: center; width: 100%; box-sizing: border-box; }

        @media (max-width: 600px) {
            .phantomix-navbar { padding: 0 15px; }
            .nav-logo { font-size: 16px; }
            .nav-btn { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <nav class="phantomix-navbar">
        <a href="index.html" class="nav-logo"><i class="fa-solid fa-gem" style="color: #0ea5e9; margin-right: 8px;"></i> Phantomix</a>
        <div class="nav-actions">
            <a href="https://wa.me/918168350829?text=Hi%20Shrikant!%20I%20need%20help%20with%20the%20Phantom%20Shrink%20tool." class="nav-btn btn-support"><i class="fab fa-whatsapp"></i> Support</a>
            <a href="apps.html" class="nav-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="app-container">
            <button class="share-btn" onclick="shareCompressorTool()" title="Share Tool">
                <i class="fas fa-share-alt"></i>
            </button>

            <h2>Phantom <span>Shrink</span></h2>
            <p class="subtitle"><i class="fas fa-file-pdf"></i> Zero-Server PDF & Image Compressor</p>

            <div class="upload-area" id="dropZone">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Click or Drop (PDF, JPG, PNG)</p>
                <input type="file" id="fileInput" accept="image/jpeg, image/png, application/pdf">
            </div>

            <div class="preview-section" id="previewSection">
                <div class="stat-box">
                    <div>
                        <div class="stat-label">Original File</div>
                        <div class="stat-value" id="originalSize">0 KB</div>
                    </div>
                    <i class="fas fa-file-alt" style="color: #334155;"></i>
                    <div>
                        <div class="stat-label">File Type</div>
                        <div class="stat-value" id="fileTypeLabel" style="color: #0ea5e9;">Unknown</div>
                    </div>
                </div>

                <div class="slider-group">
                    <label><span>Compression Quality</span> <span id="qualityPercent">70%</span></label>
                    <input type="range" id="qualitySlider" min="0.1" max="1" step="0.1" value="0.7">
                </div>

                <button class="action-btn" id="compressBtn"><i class="fas fa-compress"></i> Start Compression</button>
                <div id="statusMsg">Processing... Please wait.</div>
            </div>
        </div>
    </div>

    <footer class="phantomix-footer">
        <p>&copy; 2026 Phantomix. All rights reserved. Built with passion by Shrikant Prajapati & Ranjan Gupta.</p>
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const originalSizeText = document.getElementById('originalSize');
        const fileTypeLabel = document.getElementById('fileTypeLabel');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityPercent = document.getElementById('qualityPercent');
        const compressBtn = document.getElementById('compressBtn');
        const statusMsg = document.getElementById('statusMsg');

        let originalFile = null;

        // 🚀 Share Function Logic
        function shareCompressorTool() {
            const shareData = {
                title: 'Phantom Shrink | Secure PDF & Image Compressor',
                text: 'Compress your PDF files and photos instantly without uploading them to any server. 100% Secure & Fast!',
                url: window.location.href // Automatically grabs your live URL
            };

            if (navigator.share) {
                navigator.share(shareData).catch(err => console.log('Error sharing:', err));
            } else {
                navigator.clipboard.writeText(shareData.url).then(() => {
                    alert('Link copied to clipboard! Share it with your friends.');
                });
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        qualitySlider.addEventListener('input', (e) => {
            qualityPercent.innerText = `${Math.round(e.target.value * 100)}%`;
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            originalFile = file;
            originalSizeText.innerText = formatBytes(file.size);
            
            if(file.type === "application/pdf") {
                fileTypeLabel.innerText = "PDF Document";
                fileTypeLabel.style.color = "#ef4444";
            } else {
                fileTypeLabel.innerText = "Image File";
                fileTypeLabel.style.color = "#10b981";
            }
            
            previewSection.style.display = 'block';
            compressBtn.innerText = "Start Compression";
            compressBtn.disabled = false;
            statusMsg.style.display = 'none';
        });

        compressBtn.addEventListener('click', async () => {
            if (!originalFile) return;
            
            compressBtn.disabled = true;
            statusMsg.style.display = 'block';
            statusMsg.innerText = "Optimizing & Compressing... Please wait.";
            statusMsg.style.color = "#0ea5e9";
            
            const quality = parseFloat(qualitySlider.value);

            if (originalFile.type === "application/pdf") {
                await compressPDF(originalFile, quality);
            } else {
                await compressImage(originalFile, quality);
            }
        });

        async function compressImage(file, quality) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob((blob) => {
                        statusMsg.innerText = `✅ Success! New Size: ${formatBytes(blob.size)}`;
                        statusMsg.style.color = "#10b981";
                        
                        triggerDownload(blob, `compressed_${file.name}`);
                    }, 'image/jpeg', quality);
                };
            };
            reader.readAsDataURL(file);
        }

        async function compressPDF(file, quality) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                const { jsPDF } = window.jspdf;
                const newPdf = new jsPDF();

                const scale = Math.max(0.6, quality * 1.0);

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    statusMsg.innerText = `Compressing Page ${pageNum} of ${pdf.numPages}...`;
                    
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: scale });
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    const imgData = canvas.toDataURL('image/jpeg', quality);
                    
                    if (pageNum > 1) newPdf.addPage();
                    
                    const pdfWidth = newPdf.internal.pageSize.getWidth();
                    const pdfHeight = (viewport.height * pdfWidth) / viewport.width;
                    
                    newPdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight, undefined, 'FAST');
                }

                const pdfBlob = newPdf.output('blob');
                
                if (pdfBlob.size > file.size) {
                    statusMsg.innerText = `⚠️ Compressed size (${formatBytes(pdfBlob.size)}) was larger. Lower the slider to 40%.`;
                    statusMsg.style.color = "#ef4444";
                } else {
                    statusMsg.innerText = `✅ Success! New Size: ${formatBytes(pdfBlob.size)}`;
                    statusMsg.style.color = "#10b981";
                }

                triggerDownload(pdfBlob, `compressed_${file.name}`);
                
            } catch (error) {
                console.error(error);
                statusMsg.innerText = "Error compressing PDF. File might be protected.";
                statusMsg.style.color = "#ef4444";
                compressBtn.disabled = false;
            }
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            compressBtn.innerText = "Compress Another File";
            compressBtn.disabled = false;
        }
    </script>
</body>
</html>
